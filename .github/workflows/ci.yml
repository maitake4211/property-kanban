name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify manifest and package versions match
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          package_version=$(node -p "require('./package.json').version")
          if [ "$manifest_version" != "$package_version" ]; then
            echo "manifest.json ($manifest_version) does not match package.json ($package_version)" >&2
            exit 1
          fi
